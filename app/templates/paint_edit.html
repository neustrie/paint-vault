{% extends "base.html" %}{% block body %}
<p class="small" style="margin:0 0 4px"><a href="/">← Inventaire</a></p>
<h1 style="display:flex;align-items:center"><span class="sw" style="width:38px;height:38px;background:{{p.hex or 'transparent'}}"></span>{{p.name}}</h1>
<form class="card row" method="post" action="/paints/{{p.id}}/edit">
 <label>Marque<input name="brand" value="{{p.brand}}" required></label><label>Gamme<input name="range" value="{{p.range}}"></label>
 <label>Code<input name="code" value="{{p.code}}" size="9"></label><label>Réf. AV<input name="av_ref" value="{{p.av_ref}}" size="5"></label>
 <label>Nom<input name="name" value="{{p.name}}" required></label><label>Type<input name="type" value="{{p.type}}"></label>
 <label>Statut<select name="status">{% for k,v in STATUTS.items() %}<option value="{{k}}" {{'selected' if k==p.status}}>{{v}}</option>{% endfor %}</select></label>
 <label>Couleur (approx.)<input type="color" name="hex" value="{{p.hex or '#808080'}}"></label>
 <label>Usage<input name="usage" value="{{p.usage}}"></label><button>Enregistrer</button></form>
{% if used %}<p class="mut">Utilisée dans : {% for u in used %}<a href="/projets/{{u.id}}">{{u.name}}</a>{{', ' if not loop.last}}{% endfor %}</p>
{% else %}<form method="post" action="/paints/{{p.id}}/delete" onsubmit="return confirm('Supprimer cette peinture ?')"><button class="dng sm">Supprimer la peinture</button></form>{% endif %}
{% endblock %}
